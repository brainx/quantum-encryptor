name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dependency-locks:
    name: Dependency lock consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install lock compiler
        run: |
          python -m pip install --no-deps "pip==25.3"
          python -m pip install --no-deps \
            "pip-tools==7.5.3" \
            "packaging==26.2" \
            "build==1.5.0" \
            "click==8.4.2" \
            "pyproject-hooks==1.2.0" \
            "setuptools==83.0.0" \
            "wheel==0.47.0"

      - name: Verify npm version
        run: test "$(npm --version)" = "10.9.8"

      - name: Check dependency locks
        run: python scripts/check_dependency_locks.py

  quality:
    name: Quality checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: dependency-locks
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: python -m black --check api_app.py crypto_config.py crypto_core.py pqc_agent_tools.py ui_helpers.py scripts/check_dependency_locks.py scripts/check_release_preflight.py setup.py tests/test_agent_tools.py tests/test_api_app.py tests/test_crypto_core.py tests/test_dependency_locks.py tests/test_release_preflight.py tests/test_ui_helpers.py

      - name: Lint
        run: python -m flake8 api_app.py crypto_config.py crypto_core.py pqc_agent_tools.py ui_helpers.py scripts/check_dependency_locks.py scripts/check_release_preflight.py setup.py tests/test_agent_tools.py tests/test_api_app.py tests/test_crypto_core.py tests/test_dependency_locks.py tests/test_release_preflight.py tests/test_ui_helpers.py

      - name: Type check
        run: python -m mypy --explicit-package-bases api_app.py crypto_config.py crypto_core.py pqc_agent_tools.py ui_helpers.py scripts/check_dependency_locks.py scripts/check_release_preflight.py tests/test_agent_tools.py tests/test_api_app.py tests/test_crypto_core.py tests/test_dependency_locks.py tests/test_release_preflight.py tests/test_ui_helpers.py

      - name: Unit tests without native liboqs
        run: >
          PYTHON=python ./test.sh
          --cov=crypto_core
          --cov=pqc_agent_tools
          --cov=ui_helpers
          --cov=api_app
          --cov-report=term-missing
          --cov-fail-under=80

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    needs: dependency-locks

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install build tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build package artifacts
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: |
          python -m venv /tmp/qe-wheel-test
          /tmp/qe-wheel-test/bin/python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          /tmp/qe-wheel-test/bin/quantum-encryptor-agent health --json
          /tmp/qe-wheel-test/bin/python -I - <<'PY'
          from pathlib import Path
          from importlib.metadata import requires
          from importlib.util import find_spec
          import sys

          import api_app
          import pqc_agent_tools
          import ui_helpers

          prefix = Path(sys.prefix).resolve()
          for module in (api_app, pqc_agent_tools, ui_helpers):
              module_path = Path(module.__file__).resolve()
              assert module_path.is_relative_to(prefix), (module.__name__, module_path, prefix)
          assert find_spec("pqc_app") is None
          package_requirements = requires("quantum-encryptor") or ()
          assert all(not requirement.lower().startswith("streamlit") for requirement in package_requirements)
          PY

      - name: Smoke installed web UI
        run: |
          cd "$(mktemp -d)"
          PORT=4002 /tmp/qe-wheel-test/bin/python -I -m api_app &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4002/ | grep -q '<div id="root"></div>'; then
              curl -fsS http://127.0.0.1:4002/api/health >/dev/null
              exit 0
            fi
            sleep 1
          done
          exit 1

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: dependency-locks

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install security tooling
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt

      - name: Audit runtime dependency spec
        run: python -m pip_audit -r requirements.txt

      - name: Audit locked runtime dependencies
        run: python -m pip_audit -r requirements-lock.txt

      - name: Audit locked development dependencies
        run: python -m pip_audit -r requirements-dev-lock.txt

      - name: Audit web dependencies
        run: npm audit --package-lock-only --audit-level=high

      - name: Run Python security lint
        run: python -m bandit -q -r api_app.py crypto_core.py pqc_agent_tools.py ui_helpers.py

  web:
    name: Custom web UI
    runs-on: ubuntu-latest
    needs: dependency-locks

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Type check frontend
        run: npm run check

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Browser UI smoke
        run: |
          SKIP_WEB_BUILD=1 PYTHON=python ./start.sh &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null; then
              npm run ui-smoke
              exit 0
            fi
            sleep 1
          done
          exit 1

  locked-runtime-install:
    name: Locked runtime install
    runs-on: ubuntu-latest
    needs: dependency-locks

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Verify package imports
        run: |
          python - <<'PY'
          import crypto_config
          import crypto_core
          import api_app
          import pqc_agent_tools
          import ui_helpers

          print("locked runtime import check ok")
          PY

  native-oqs:
    name: Native liboqs integration tests
    runs-on: ubuntu-latest
    needs: dependency-locks

    env:
      OQS_INSTALL_PATH: ${{ github.workspace }}/.local/oqs
      LD_LIBRARY_PATH: ${{ github.workspace }}/.local/oqs/lib:${{ github.workspace }}/.local/oqs/lib64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tools
        timeout-minutes: 10
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y build-essential cmake ninja-build

      - name: Build and install native liboqs
        run: |
          git init .ci/liboqs
          git -C .ci/liboqs remote add origin https://github.com/open-quantum-safe/liboqs.git
          # liboqs 0.16.0
          git -C .ci/liboqs fetch --depth=1 origin 5a1a854b0dc9f2141bdc771c555ee60c37950183
          git -C .ci/liboqs checkout --detach 5a1a854b0dc9f2141bdc771c555ee60c37950183
          cmake -S .ci/liboqs -B .ci/liboqs/build \
            -GNinja \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="${OQS_INSTALL_PATH}"
          cmake --build .ci/liboqs/build --parallel 2
          cmake --install .ci/liboqs/build

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Verify native backend is active
        run: |
          python - <<'PY'
          import oqs

          getter = getattr(oqs, "get_enabled_kem_mechanisms", None)
          if getter is None:
              getter = oqs.get_enabled_KEM_mechanisms

          enabled = set(getter())
          assert {"ML-KEM-768", "Kyber768"}.issubset(enabled), sorted(enabled)[:20]
          PY

      - name: OQS-backed test suite
        run: PYTHON=python ./test.sh

      - name: Agent CLI native round trip
        run: |
          printf 'agent round trip\n' > agent-input.txt
          PQC_PRIVATE_KEY_PASSWORD='correct horse battery staple' \
            python -m pqc_agent_tools generate-keys \
              --public-out agent-public.pem \
              --private-out agent-private.pem
          python -m pqc_agent_tools inspect-key --key agent-private.pem
          python -m pqc_agent_tools encrypt \
            --input agent-input.txt \
            --public-key agent-public.pem \
            --output agent-input.pqc
          python -m pqc_agent_tools inspect-file --input agent-input.pqc
          PQC_PRIVATE_KEY_PASSWORD='correct horse battery staple' \
            python -m pqc_agent_tools verify-file \
              --input agent-input.pqc \
              --private-key agent-private.pem
          PQC_PRIVATE_KEY_PASSWORD='correct horse battery staple' \
            python -m pqc_agent_tools decrypt \
              --input agent-input.pqc \
              --private-key agent-private.pem \
              --output agent-output.txt
          cmp agent-input.txt agent-output.txt

      - name: Native browser encryption round trip
        run: |
          SKIP_WEB_BUILD=1 PYTHON=python ./start.sh &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          required = ("generate", "encrypt", "decrypt")
          deadline = time.monotonic() + 30

          while (remaining := deadline - time.monotonic()) > 0:
              try:
                  with urlopen("http://127.0.0.1:4000/api/health", timeout=min(1, remaining)) as response:
                      health = json.load(response)
              except Exception:
                  health = None

              ready = bool(
                  health
                  and health.get("ok")
                  and health.get("backendReady")
                  and all(health.get("capabilities", {}).get(name, {}).get("available") for name in required)
              )
              if ready:
                  raise SystemExit(0)

              remaining = deadline - time.monotonic()
              if remaining > 0:
                  time.sleep(min(0.25, remaining))

          raise SystemExit("Native local app did not become ready within 30 seconds.")
          PY
          npm run ui-native
